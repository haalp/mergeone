# mergeone pilot gateway on Fly.io: one small always-on machine, the gatelog on a volume. See README.md here.
app = "mergeone-pilot"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[mounts]
  source = "mergeone_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"     # webhooks, debounce timers and the queue live in this process
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
