# Example: run mergeone gate on every pull request. Copy to .github/workflows/mergeone.yml
name: mergeone gate
on: [pull_request]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install mergeone
      - name: decide
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          gate pr --policy .mergeone.yaml --base origin/${{ github.base_ref }} --head HEAD > gate.json || true
          cat gate.json
          echo "verdict=$(jq -r .verdict gate.json)" >> $GITHUB_OUTPUT
          echo "route=$(jq -r .route gate.json)" >> $GITHUB_OUTPUT
        id: gate
      - name: label
        uses: actions/github-script@v7
        with:
          script: |
            const route = "${{ steps.gate.outputs.route }}", verdict = "${{ steps.gate.outputs.verdict }}";
            await github.rest.issues.addLabels({ ...context.repo, issue_number: context.issue.number, labels: [`gate:${verdict}`, `route:${route}`] });
      - name: fail on block
        if: steps.gate.outputs.verdict == 'block'
        run: exit 1
