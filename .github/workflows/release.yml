name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write     # the release and its assets
  packages: write     # ghcr.io/haalp/mergeone
  id-token: write     # keyless cosign signatures (Sigstore)
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24", cache-dependency-path: gate/go.sum }
      - name: build
        env: { GOOS: "${{ matrix.goos }}", GOARCH: "${{ matrix.goarch }}", CGO_ENABLED: "0" }
        run: |
          cd gate
          go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o ../dist/mergeone_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }} ./cmd/mergeone
          mkdir -p ../dist/assets && cp ../mergeone/gate/policy.yaml ../mergeone/gate/calibration_*.json ../prompts/jev_v2.json ../prompts/jev_v3.json ../prompts/jev_v4.json ../prompts/jev_pair.json ../prompts/haiku_v2.md ../prompts/haiku_v3.md ../prompts/haiku_v4.md ../prompts/haiku_pair.md ../prompts/models.yaml ../dist/assets/
          cd ../dist && tar czf mergeone_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz mergeone_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }} assets
      - name: smoke (subcommands in the binary)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          ./dist/mergeone_linux_amd64 version | grep -qx "mergeone ${GITHUB_REF_NAME}"
          for c in init doctor serve pr decide explain policy replay drift-replay calibrate stats loadtest index models mcp; do
            ./dist/mergeone_linux_amd64 "$c" -h >/dev/null 2>&1 || { echo "subcommand $c missing"; exit 1; }
          done
          ./dist/mergeone_linux_amd64 policy check --policy mergeone/gate/policy.yaml --assets dist/assets >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, pattern: "archive-*", merge-multiple: true }
      - name: checksums
        run: |
          cd dist && sha256sum *.tar.gz > checksums.txt && cat checksums.txt
      - uses: sigstore/cosign-installer@v3
      - name: sign (keyless, Sigstore; verify with `cosign verify-blob --certificate-identity-regexp github.com/haalp/mergeone --certificate-oidc-issuer https://token.actions.githubusercontent.com --bundle checksums.txt.sigstore.json checksums.txt`)
        run: |
          cd dist && cosign sign-blob --yes --bundle checksums.txt.sigstore.json checksums.txt
      - name: SBOM (SPDX, the Go module graph of the gateway)
        uses: anchore/sbom-action@v0
        with:
          path: gate
          format: spdx-json
          output-file: dist/mergeone-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: release notes (the CHANGELOG summary of this tag)
        run: |
          awk -v h="## ${GITHUB_REF_NAME} " 'index($0, h) == 1 { f = 1; next } f && (/^## / || /^Dated changes:/) { exit } f' CHANGELOG.md \
            | sed -e '/./,$!d' > dist/notes.md
          grep -q '[^[:space:]]' dist/notes.md || { echo "no CHANGELOG.md summary under '## ${GITHUB_REF_NAME} '"; exit 1; }
          printf '\n---\nVerify: `sha256sum -c checksums.txt`; the checksums file is signed keyless with Sigstore (`checksums.txt.sigstore.json`); the SBOM is `mergeone-%s.spdx.json`; the container image is `ghcr.io/haalp/mergeone:%s` (signed, same identity).\n' "${GITHUB_REF_NAME}" "${GITHUB_REF_NAME}" >> dist/notes.md
          cat dist/notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/checksums.txt.sigstore.json
            dist/*.spdx.json
          body_path: dist/notes.md

  image:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/haalp/mergeone
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: sigstore/cosign-installer@v3
      - name: sign the image (keyless)
        run: cosign sign --yes ghcr.io/haalp/mergeone@${{ steps.push.outputs.digest }}
