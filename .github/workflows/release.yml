name: release
on:
  push:
    tags: ["v*"]
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24", cache-dependency-path: gate/go.sum }
      - name: build
        env: { GOOS: "${{ matrix.goos }}", GOARCH: "${{ matrix.goarch }}", CGO_ENABLED: "0" }
        run: |
          cd gate
          go build -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o ../dist/mergeone_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }} ./cmd/mergeone
          mkdir -p ../dist/assets && cp ../mergeone/gate/policy.yaml ../mergeone/gate/calibration_*.json ../prompts/jev_v2.json ../prompts/jev_pair.json ../prompts/haiku_v2.md ../prompts/haiku_pair.md ../prompts/models.yaml ../dist/assets/
          cd ../dist && tar czf mergeone_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz mergeone_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }} assets
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
