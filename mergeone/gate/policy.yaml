# mergeone default policy. Copy to .mergeone.yaml in your repo and edit.
#
# A policy maps typed decisions (probabilities from the decision model) to a
# verdict and a route. Rules are evaluated top to bottom; the first match
# wins. Probabilities are calibrated (see calibration.json) before rules run.

version: 1
model: jev            # any key in prompts/models.yaml: jev | pplx | pplx-flash | haiku | clef | local | … (mergeone models)
# model_id: pplx-decider-flash-v1.2   # optional pin
# provider:           # optional: override/define the model inline (same keys as a models.yaml row).
#   dialect: systemone                 #   e.g. a private llama.cpp / vLLM server serving open weights
#   endpoint: http://10.0.0.5:8080/v1/systemone
#   key_env: MY_GATE_KEY
#   key_optional: true
#   input_per_mtok: 0
question_set: v2      # prompts/jev_v2.json / prompts/haiku_v2.md
calibration: auto     # auto = use shipped calibration.json for this model if present

# Paths that always need a human, regardless of model output (mechanical, free).
always_human_paths:
  - "pkg/apis/"
  - "staging/src/k8s.io/api/"
  - "plugin/pkg/auth/"

# PR memory (run 4): remembers the repo's recent PRs and asks the model, per PR, whether
# it duplicates one of the top_k most similar ones. Adds `duplicate_of` and `silent_days`
# to the probabilities so rules below can use them. Backfill once: mergeone index owner/name
memory:
  enabled: true
  top_k: 5
  pair_state: compact   # pair call input: compact (default; PROTOCOL.md §R8 C1, R8-H1) | full (the run-4 rendering)

rules:
  - name: duplicate-of
    when: { duplicate_of: ">= 0.7" }
    verdict: hold
    route: dedup
    reason: "Looks like the same change as an existing PR"

  - name: stale
    when: { silent_days: ">= 14" }
    verdict: hold
    route: stale
    reason: "No activity for two weeks; close or rebase"

  - name: weakened-tests
    when: { weakens_tests: ">= 0.6" }
    verdict: block
    route: human
    reason: "PR appears to remove, skip, or loosen tests"

  - name: concurrency-risk
    when: { touches_concurrency: ">= 0.6", is_logic_change: ">= 0.5" }
    verdict: hold
    route: domain-review
    reason: "Behaviour change in concurrency-sensitive code"

  - name: maintainer-judgement
    when: { needs_human_review: ">= 0.5" }
    verdict: hold
    route: human
    reason: "Decision model thinks a maintainer should look"

  - name: trivial
    when: { is_logic_change: "<= 0.2" }
    verdict: pass
    route: auto-merge
    reason: "No behaviour change detected"

default:
  verdict: pass
  route: auto-merge-after-ci
  reason: "No rule matched"

# When the model errors or times out, fail closed.
on_error:
  verdict: hold
  route: human
  reason: "Decision model unavailable"

# Drift monitor (docs/drift-monitor.md): watches each question's raw-probability mean and spread in the
# gatelog. On by default since v0.3 (run 8 R8-H5 passed). A rule that reads a degraded question is not
# evaluated and the PR gets on_drift with reason drift:<question>. `enabled: false` turns it off.
drift:
  enabled: true
# on_drift: { verdict: hold, route: human }   # default; `ignore` keeps the rules as they are
